name: Android

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout with Ghostty submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Build pinned libghostty-vt
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: ./scripts/build-libghostty-android.sh

      - name: Run host and JVM tests
        run: |
          ./scripts/run-ghostty-host-tests.sh
          ./gradlew testDebugUnitTest

      - name: Lint and build all APKs without devices
        run: ./gradlew lintDebug assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Verify packaged JNI libraries
        run: ./scripts/verify-ghostty-packaging.sh
