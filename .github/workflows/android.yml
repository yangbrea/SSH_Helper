name: Android

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout with Ghostty submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install pinned Android NDK
        run: |
          # The runner image no longer guarantees `sdkmanager` on PATH (it exited 127),
          # so derive it from the SDK root instead of trusting PATH.
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK root is not set}}"
          sdkmanager="$(find "$sdk_root" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort | head -1)"
          if [[ -z "$sdkmanager" ]]; then
            echo "sdkmanager not found under $sdk_root" >&2
            ls -la "$sdk_root" >&2 || true
            exit 1
          fi
          echo "Using $sdkmanager"
          # sdkmanager may prompt for licence acceptance for a new package.
          yes | "$sdkmanager" --sdk_root="$sdk_root" "ndk;29.0.14206865"
          # The native build scripts resolve the NDK as <sdk>/ndk/<version>; fail here
          # rather than several steps later if it landed somewhere else.
          test -d "$sdk_root/ndk/29.0.14206865" || {
            echo "NDK 29.0.14206865 not found under $sdk_root/ndk" >&2
            ls -la "$sdk_root/ndk" >&2 || true
            exit 1
          }
          # Publish the resolved path for later steps. The `env` context cannot be used
          # for this: it only sees variables defined in this workflow, not the ones the
          # runner image exports, so it expands to empty and the build steps would look
          # for "/ndk/29.0.14206865".
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build pinned libghostty-vt
        run: ./scripts/build-libghostty-android.sh

      - name: Build pinned OpenSSL/libssh2
        run: ./scripts/build-libssh2-android.sh

      - name: Build pinned libssh2 for the host
        # run-ssh-native-host-tests.sh compiles its libssh2 cases with `-lssh2`, and the
        # host needs headers plus a library the host compiler can use. The NDK build above
        # only produces Android-ABI artifacts, so it cannot serve that.
        #
        # The distro package is not a substitute either: the sources call
        # libssh2_session_callback_set2, added in libssh2 1.11.1, while Ubuntu 24.04 ships
        # 1.11.0 and fails to compile. Building the lock-pinned source also means the host
        # tests finally exercise the same libssh2 the APK ships.
        run: |
          ./scripts/build-libssh2-host.sh
          echo "SSH_NATIVE_HOST_LIBSSH2_PREFIX=$PWD/app/build/ssh-native/host-prefix" >> "$GITHUB_ENV"

      - name: Run host and JVM tests
        run: |
          ./scripts/run-ghostty-host-tests.sh
          ./scripts/run-ssh-native-host-tests.sh
          ./gradlew testDebugUnitTest

      - name: Lint and build all APKs without devices
        run: ./gradlew lintDebug assembleDebug assembleRelease assembleDebugAndroidTest

      - name: Verify packaged JNI libraries
        run: |
          ./scripts/verify-ghostty-packaging.sh
          ./scripts/verify-ssh-native-packaging.sh
